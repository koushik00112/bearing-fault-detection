name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,cnn]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy bearing
      - name: Leakage guard (fails if any recording is on both sides of a split)
        run: pytest -q tests/test_splits.py
      - name: All tests
        run: pytest --cov=bearing --cov-report=term-missing --cov-fail-under=80

  pipeline-smoke:
    # The whole protocol on SYNTHETIC data in quick mode: proves the pipeline runs end to end.
    # It produces no results worth reporting, and the report says so in a banner.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[cnn]"
      - run: python -m bearing.prepare synthetic --out data/processed/synthetic
      - run: python -m bearing.run --data data/processed/synthetic --out results/ci-smoke --quick --seeds 0,1 --no-mlflow
      - run: grep -q "SYNTHETIC DATA" results/ci-smoke/summary.md
      - uses: actions/upload-artifact@v7
        with:
          name: synthetic-smoke-report
          path: |
            results/ci-smoke/summary.md
            results/ci-smoke/*.png

  docker:
    # Serving image + a tiny fixture model trained on synthetic data.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: docker build -t bearing-model:ci .
      - run: python scripts/fixture_model.py models/fixture
      - name: Serve the fixture model and smoke-test /predict
        run: |
          docker run -d --name model -p 8100:8100 -v "$PWD/models/fixture:/models:ro" bearing-model:ci
          timeout 60 sh -c 'until curl -sf localhost:8100/readyz; do sleep 1; done'
          python scripts/predict_smoke.py http://localhost:8100
      - name: Image scan (fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: bearing-model:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - if: failure()
        run: docker logs model
